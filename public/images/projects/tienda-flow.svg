<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Flujo de la tienda de películas</title>
  <desc id="desc">El catálogo y el carrito llevan al registro de pedidos y a la gestión de stock.</desc>
  <rect width="1200" height="500" fill="#f3f3f3"/>
  <g font-family="Consolas,monospace" fill="#1e1e1e">
    <text x="56" y="68" font-size="16" fill="#267f99">FLUJO DE LA APLICACIÓN</text>
    <text x="56" y="113" font-size="29">Del catálogo al pedido</text>
    <g font-size="18">
      <rect x="55" y="185" width="235" height="170" rx="8" fill="#fff" stroke="#c8c8c8" stroke-width="2"/><text x="78" y="232" fill="#007acc">01 / CATÁLOGO</text><text x="78" y="278">Películas y stock</text><text x="78" y="316" font-size="16" fill="#616161">Consulta MVC / API</text>
      <rect x="365" y="185" width="235" height="170" rx="8" fill="#fff" stroke="#c8c8c8" stroke-width="2"/><text x="388" y="232" fill="#007acc">02 / CARRITO</text><text x="388" y="278">Selección de títulos</text><text x="388" y="316" font-size="16" fill="#616161">Sesión de cliente</text>
      <rect x="675" y="185" width="205" height="170" rx="8" fill="#fff" stroke="#c8c8c8" stroke-width="2"/><text x="698" y="232" fill="#007acc">03 / PEDIDO</text><text x="698" y="278">Registro</text><text x="698" y="316" font-size="16" fill="#616161">Entity Framework</text>
      <rect x="955" y="185" width="205" height="170" rx="8" fill="#fff" stroke="#c8c8c8" stroke-width="2"/><text x="978" y="232" fill="#007acc">04 / DATOS</text><text x="978" y="278">Pedido y stock</text><text x="978" y="316" font-size="16" fill="#616161">SQL Server</text>
    </g>
    <g fill="none" stroke="#007acc" stroke-width="4"><path d="M290 270h65m-13-13 13 13-13 13"/><path d="M600 270h65m-13-13 13 13-13 13"/><path d="M880 270h65m-13-13 13 13-13 13"/></g>
    <text x="56" y="425" font-size="16" fill="#616161">Aplicación C# con áreas distintas para clientes y administración.</text>
  </g>
</svg>
