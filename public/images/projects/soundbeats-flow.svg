<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Flujo de SoundBeats</title>
  <desc id="desc">Una consulta y su audio se gestionan en la aplicación Spring Boot. La aplicación recibe un resultado externo mediante RabbitMQ para su revisión.</desc>
  <rect width="1200" height="500" fill="#f3f3f3"/>
  <g font-family="Consolas,monospace" fill="#1e1e1e">
    <text x="56" y="68" font-size="16" fill="#267f99">FLUJO DEL PROTOTIPO</text>
    <text x="56" y="113" font-size="29">Consultas, audio y recepción de resultados</text>
    <g font-size="18">
      <rect x="55" y="185" width="235" height="170" rx="8" fill="#fff" stroke="#c8c8c8" stroke-width="2"/><text x="78" y="232" fill="#007acc">01 / USUARIO</text><text x="78" y="278">Consulta + audio</text><text x="78" y="316" font-size="16" fill="#616161">Formulario web</text>
      <rect x="365" y="185" width="235" height="170" rx="8" fill="#fff" stroke="#c8c8c8" stroke-width="2"/><text x="388" y="232" fill="#007acc">02 / APLICACIÓN</text><text x="388" y="278">Registro y vistas</text><text x="388" y="316" font-size="16" fill="#616161">Java · Spring Boot</text>
      <rect x="675" y="185" width="205" height="170" rx="8" fill="#fff" stroke="#c8c8c8" stroke-width="2"/><text x="698" y="232" fill="#007acc">03 / RESULTADO</text><text x="698" y="278">Servicio externo</text><text x="698" y="316" font-size="16" fill="#616161">RabbitMQ · AMQP</text>
      <rect x="955" y="185" width="205" height="170" rx="8" fill="#fff" stroke="#c8c8c8" stroke-width="2"/><text x="978" y="232" fill="#007acc">04 / REVISIÓN</text><text x="978" y="278">Historial</text><text x="978" y="316" font-size="16" fill="#616161">Resultado recibido</text>
    </g>
    <g fill="none" stroke="#007acc" stroke-width="4"><path d="M290 270h65m-13-13 13 13-13 13"/><path d="M600 270h65m-13-13 13 13-13 13"/><path d="M880 270h65m-13-13 13 13-13 13"/></g>
    <text x="56" y="425" font-size="16" fill="#616161">Proyecto colaborativo: un servicio externo devuelve resultados a través de RabbitMQ.</text>
  </g>
</svg>
